name: census-gate
# Behavioral-completeness censuses. Each drives the REAL StrategyArbiter over a
# grid derived from production's own structure, and fails on an UNEXPLAINED cell.
#
#   craft:     can the planner plan every craftable recipe?   -> planner_bug == 0
#   recycle:   does the planner RECYCLE to obtain a material? -> recycle_source_bug == 0
#              LIVENESS/BANKED/PARTIAL prove the acquisition route fires (bag,
#              bank, and a partial cover that must resolve WITHIN BUDGET — a
#              planner TIMEOUT is classified as the bug, never as an explained
#              gap). SAFETY is the one that matters most: it proves the last
#              copper_axe (WORKING_KIT) is never dismantled for its copper_bar.
#   inventory: does the planner obey the keep authority?      -> inventory_bug == 0
#              plus REASON COVERAGE: every KeepReason (except CURRENCY, whose
#              KEEP_ALL means nothing is ever disposable) must have a PASSing
#              LIVENESS cell. This is the anti-rot mechanism: a new protection
#              reason cannot be added without proving its surplus is still
#              disposable. It is what makes "keep ALL copies" — the type-level
#              defect behind seven hoard bugs — unable to come back silently.
#   parity:    do the TWO plan producers agree on obtainability? -> obtain_parity_bug == 0
#              The one-obtain-model ACCEPTANCE gate: for a grid of (material,
#              world-state) cells the O(closure) descent and the A* search must
#              agree — the pool a goal admits ⊆ the shared obtain model, the
#              model ⊆ the pool, and both producers' plans use the SAME source
#              KINDS (WITHDRAW carved out, since the descent serves it via a
#              recipe-input withdraw, not a map leg). This is the gate that makes
#              the SEVEN-INERT-COMMITS divergence bug — the recycle route that
#              reached A* but not the generator — impossible to ship again. A
#              planner TIMEOUT is classified as the bug, never an explained gap.
#   shed:      can a rung licensed to shed actually BE selected, and do the drain
#              and the disposal route still agree? -> shed_starvation_bug == 0 AND
#              disposal_contradiction_bug == 0
#              The disposal-unification ACCEPTANCE gate. Its LIVENESS cells demand
#              the arbiter SELECT the shed rung and return a non-empty,
#              bag-bounded plan — both halves, because the drain used to be
#              ranked below the always-plannable objective step AND, once given a
#              slot, returned plan_len=0 (all-or-nothing satisfaction against a
#              120-quantity bag). Its QUIET cell demands the rung NOT win when it
#              is licensed nothing, which is what stops the fix from becoming an
#              unconditional hoist that parks progression forever. Its sweep is
#              the adapter-level twin of Formal.DisposalRoute's
#              `drained_is_never_deposited`: no catalog code may be both
#              drain-licensed and still under its bank keep cap.
#
# The craft + inventory gates were documented long before they were enforced
# here; the recycle gate shipped with its epic (2026-07-14), the parity gate
# with the one-obtain-model epic (2026-07-15), the shed gate with part 2 of the
# disposal-unification epic (2026-08-05).
on:
  pull_request:
    paths:
      - "src/**/*.py"
      - "scripts/gen_reachability_claims.py"
      - "scripts/gen_craft_completeness.py"
      - "scripts/gen_inventory_completeness.py"
      - "scripts/gen_recycle_source_completeness.py"
      - "scripts/gen_obtain_parity.py"
      - "scripts/gen_requirement_parity.py"
      - "scripts/gen_shed_reachability.py"
      - "scripts/gen_open_rung.py"
      - "scripts/gen_one_cost_model.py"
      - "scripts/gen_currency_wall.py"
      - "scripts/gen_drop_wall.py"
      - ".github/workflows/census-gate.yml"
  push:
    branches: [main]
    paths:
      - "src/**/*.py"
      - "scripts/gen_reachability_claims.py"
      - "scripts/gen_craft_completeness.py"
      - "scripts/gen_inventory_completeness.py"
      - "scripts/gen_recycle_source_completeness.py"
      - "scripts/gen_obtain_parity.py"
      - "scripts/gen_requirement_parity.py"
      - "scripts/gen_shed_reachability.py"
      - "scripts/gen_open_rung.py"
      - "scripts/gen_one_cost_model.py"
      - "scripts/gen_currency_wall.py"
      - "scripts/gen_drop_wall.py"
      - ".github/workflows/census-gate.yml"
  workflow_dispatch: {}

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: false
      - name: Generate artifactsmmo-api-client
        run: |
          set -euxo pipefail
          pip install openapi-python-client
          bash generate_openapi_client.sh
      - name: Sync deps
        run: uv sync --dev

      # Comments that assert a named thing has NO CALLER, verified against the
      # real import graph. The wave-3b deletion pass found three asserting that
      # LIVE code was dead -- the worst on `ai/obtain_sources`, imported by
      # eleven production modules and feeding both plan producers. Cheapest
      # census in the set (0.7s, `ast` over src/ only), so it runs first.
      - name: reachability-claim census — every no-caller claim is TRUE
        run: uv run python scripts/gen_reachability_claims.py --check

      # Obligation O1 of the wave-3 resolution design (spec 2026-08-23 3.5):
      # every ReachSkillLevel(S, C+1) reachable across the scenario set has an
      # open, XP-positive rung, or a NAMED wall. The residual is a closed cell
      # the root graph actually routes to -- the silent fall-through wave 3
      # would otherwise turn into a stall, because ReachSkillLevel is the only
      # path from a skill-gated gear target to work.
      - name: open-rung census — o1_silent_stall == 0 AND o1_unexplained == 0
        run: uv run python scripts/gen_open_rung.py --check

      - name: shed-reachability census — shed_starvation_bug == 0 AND disposal_contradiction_bug == 0
        run: uv run python scripts/gen_shed_reachability.py --check

      - name: inventory census — inventory_bug == 0 AND every KeepReason has a passing LIVENESS cell
        run: uv run python scripts/gen_inventory_completeness.py --check

      - name: recycle-source census — recycle_source_bug == 0
        run: uv run python scripts/gen_recycle_source_completeness.py --check

      - name: craft census — planner_bug == 0
        run: uv run python scripts/gen_craft_completeness.py --check

      - name: obtain-parity census — obtain_parity_bug == 0
        run: uv run python scripts/gen_obtain_parity.py --check

      # DRIFT gate, not a bug count. The requirement-walk census is
      # characterization-first: today's answer includes the four D-defects the
      # unification epic exists to remove, so a "== 0" residual would be
      # permanently red or would launder them into "expected". It fails when the
      # committed matrix and a fresh run disagree, which during the migration
      # waves is the signal that matters.
      - name: requirement-walk parity — answers unchanged
        run: uv run python scripts/gen_requirement_parity.py --check

      # Obligations O6 and O8 of the wave-6 routes design (§7): no Decision
      # prices anything except through route_price, and no Decision branches on
      # a SourceKind. Wired into formal/gate.sh when it shipped but never added
      # here, so CI could not see it -- the same invisibility this workflow
      # exists to prevent.
      - name: one-cost-model census — o6_second_pricer == 0 AND o8_route_kind_branch == 0
        run: uv run python scripts/gen_one_cost_model.py --check

      # Obligation O7 (§7): every currency the price walk charged at
      # UNOBTAINABLE_PER_UNIT while pricing a resolved root is task-earnable or
      # a NAMED wall. The residual is a charged currency with a BEATABLE dropper
      # on a live tile. --check also fails when the FUNDED arm has no witness:
      # this census's first run swept a full-sized grid in a single world whose
      # only tasks_coin vendor had no tile, and proved nothing while looking
      # clean.
      - name: currency-wall census — o7_silent_currency_stall == 0 AND the funded arm has a witness
        run: uv run python scripts/gen_currency_wall.py --check

      # The unwinnable-dropper wall (`obtain_sources._drop_sources`), priced over
      # root + ALTERNATIVES rather than the argmax alone. An infinite price is a
      # veto, so a drop-walled candidate never becomes the resolved root: on the
      # argmax this census reports 0 walls, over the candidates it reports 9.
      # --check also fails when neither wall arm has a witness, which would mean
      # the fixtures, the pricer or the detector moved.
      - name: drop-wall census — drop_wall_unattributed == 0 AND a wall arm has a witness
        run: uv run python scripts/gen_drop_wall.py --check
