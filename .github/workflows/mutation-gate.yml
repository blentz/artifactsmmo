name: mutation-gate
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch: {}
  pull_request:
    paths:
      - "src/artifactsmmo_cli/ai/**"
      - "formal/diff/**"
      - "openapi.json"
      - ".github/workflows/mutation-gate.yml"
  # This repo merges by fast-forward push straight to main -- it never opens
  # PRs -- so the pull_request trigger above never fires and there was zero
  # per-change mutation enforcement; only the nightly cron caught a survivor,
  # up to ~24h after the commit that introduced it. Same paths filter as
  # pull_request above, so a push to main gets the identical per-change gate
  # a PR-based workflow would have gotten.
  push:
    branches: [main]
    paths:
      - "src/artifactsmmo_cli/ai/**"
      - "formal/diff/**"
      - "openapi.json"
      - ".github/workflows/mutation-gate.yml"
jobs:
  mutate:
    runs-on: ubuntu-latest
    # Raised from 60 when the oracle build landed above. The old runs finished in
    # ~40 min while 127 of the 221 groups were failing instantly on a missing
    # oracle; now those groups actually execute their diff tests once per mutant,
    # and a cold Lean cache adds a build on top. A local full sweep of all 221
    # groups (6 workers) is the calibration point, and 60 min no longer has the
    # headroom.
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      # mutate.py runs die to runner OOM (peak ~22GB locally vs 16GB runner);
      # unbuffered output makes the post-mortem log show which mutation group
      # was running when the runner is killed.
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6
      # THE ORACLE MUST BE BUILT HERE. 127 of the 221 run_groups bind a
      # formal/diff/test_*_diff.py, and without the oracle binary every one of
      # those files fails at import-time-ish with `RuntimeError: oracle not
      # built` -- for the unmutated code and for every mutant alike. A test file
      # that fails unconditionally KILLS every mutant bound to it, so more than
      # half the gate was reporting vacuous kills and enforcing nothing. Found
      # 2026-08-15: `cheapest_path: freeze the rung body` survived a local sweep
      # while CI, three runs in a row, reported a survivor set that did not
      # include it. Same elan + cache + build sequence formal-gate.yml uses.
      - name: Install elan (Lean)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lean .lake
        uses: actions/cache@v5
        with:
          path: formal/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('formal/lakefile.toml', 'formal/lean-toolchain', 'formal/lake-manifest.json') }}
          restore-keys: |
            lake-${{ runner.os }}-
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
      - name: Generate artifactsmmo-api-client
        run: |
          set -euxo pipefail
          pip install openapi-python-client
          bash generate_openapi_client.sh
      - name: Sync deps
        run: uv sync --dev
      - name: Mathlib cache prefetch
        run: cd formal && lake exe cache get 2>&1 | tail -3 || echo "cache get skipped"
      - name: Build the differential oracle
        run: cd formal && lake build oracle
      # Fail fast and LOUDLY if the oracle is still missing: a silent absence is
      # what produced ten days of vacuous kills, so never let the sweep start
      # without it again.
      - name: Oracle must exist before the sweep
        run: |
          test -x formal/.lake/build/bin/oracle \
            || { echo "::error::oracle binary missing — every diff-bound group would report a vacuous kill"; exit 1; }
      - name: Snapshot src/ baseline
        run: |
          git diff --quiet src/ || (echo "src/ dirty before mutation run — aborting" && exit 1)
      - name: Run mutation gate
        run: |
          set -euxo pipefail
          uv run python formal/diff/mutate.py
      - name: Leak fail-fast — src/ must be clean after run
        run: |
          if ! git diff --quiet src/; then
            echo "::error::mutate.py leaked a mutation into src/."
            git diff src/ | head -200
            git checkout -- src/
            exit 1
          fi
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: |
            formal/diff/mutation_*.log
            formal/diff/survivors_*.txt
          if-no-files-found: ignore
